[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadbolt"
version = "0.5.0"
description = "Human-approved, time-limited privileged actions for AI agents."
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
bot = ["discord.py>=2.4,<3"]

[project.scripts]
deadbolt-executor = "deadbolt.executor:main"
deadbolt-bot = "deadbolt.bot:main"

[tool.setuptools.packages.find]
where = ["src"]
