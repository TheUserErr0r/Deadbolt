# Root-owned allow-list. Empty by default: no privileged action can be granted.
[firewall_profiles]

# Parameterized families are empty by default. Enabling one requires a full
# root-owned boundary; a Hermes request supplies only destination, purpose,
# TTL, and the first bounded argv command. Later commands share the approved
# session but are checked and audited separately.
[access_profiles]

# Disabled until the dedicated proxy user, pinned keys, exact firewall guard,
# restricted spool/exporter, and Argus receiver are installed and verified.
# This policy is root-owned; Hermes supplies only kind, literal IP, port,
# purpose, and requested duration. The hard maximum may be at most 24 hours.
# [outbound_access]
# enabled = true
# max_ttl_seconds = 86400
# allowed_cidrs = ["192.168.1.0/24"]
# allow_public = false
# proxy_port = 10022
# proxy_host_key = "/etc/deadbolt-ssh-proxy/host_ed25519"
# hermes_client_key = "/etc/deadbolt-ssh-proxy/hermes.pub"
# spool_dir = "/var/lib/deadbolt-ssh-proxy/ssh-spool"
# [[outbound_access.ssh_targets]]
# ip = "192.168.1.205"
# port = 22
# user = "reptor"
# key = "/etc/deadbolt-ssh-proxy/keys/sysreptor"
# host_fingerprint = "SHA256:REPLACE_WITH_VERIFIED_TARGET_FINGERPRINT"

# Separate target-initiated listener grants; disabled by default. Root checks
# that the requested private local IP is assigned to a non-loopback interface.
# [ingress_access]
# enabled = true
# max_ttl_seconds = 3600
# max_port_width = 5
# allowed_source_cidrs = ["192.168.1.0/24"]

# [access_profiles.ssh-session]
# direction = "out"
# protocol = "tcp"
# ports = [22]
# max_ttl_seconds = 900
# target_types = ["ip", "dns"]
# allowed_cidrs = ["192.168.1.0/24"]
# allow_public = false
# operator_approval = true
# audited_execution = true
# ssh_user = "maintainer"
# ssh_key = "/etc/deadbolt/keys/maintainer"
# known_hosts = "/etc/deadbolt/known-hosts/managed"
# remote_commands = ["uptime"]
# max_commands = 20
# max_command_seconds = 60
# audit_output = "metadata"
# To capture exact argv and bounded stdout/stderr in the separate restricted
# evidence sink, set audit_output = "full" and configure its executor path.
# A reviewed foreground installer may raise max_command_seconds up to 900;
# this requires audit_output = "full" and a restricted sink. The approved
# session TTL must be long enough to cover it.

# Body capture remains disabled until the versioned root-owned helper and its
# independent expiry timer are verified on the target host.
[proxy_body_capture]
enabled = false

# Only exact hostnames deliberately reviewed by the operator belong here.
# The list starts empty. For a local LLM, establish a stable internal FQDN
# (for example llm.home.arpa) before approving it in this root-owned policy.
[body_capture_exclusions]
allowed_hosts = []

# Empty by default. The proxy is always stopped by emergency stop; only
# explicitly configured additional workload services are stopped.
[emergency_stop]
workload_units = []

# Replace the destination with an exact approved CIDR before enabling a profile.
# [firewall_profiles.https-temporary]
# direction = "out"
# protocol = "tcp"
# source = "any"
# destination = "REPLACE_WITH_APPROVED_CIDR"
# port = 443
# max_ttl_seconds = 900
