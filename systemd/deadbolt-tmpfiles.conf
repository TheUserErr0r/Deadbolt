# Installed under /usr/lib/tmpfiles.d/ or /etc/tmpfiles.d/ during a later deployment.
d /run/deadbolt 0755 root root - -
d /run/deadbolt/ingress 0750 deadbolt hermes - -
d /run/deadbolt/ssh-proxy 0750 root deadbolt-ssh-proxy - -
d /var/lib/deadbolt-ssh-proxy 0700 deadbolt-ssh-proxy deadbolt-ssh-proxy - -
d /var/lib/deadbolt-ssh-proxy/ssh-spool 0700 deadbolt-ssh-proxy deadbolt-ssh-proxy - -
f /run/ufw.lock 0600 root root - -
f /run/xtables.lock 0600 root root - -
